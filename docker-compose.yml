services:
  postgres:
    image: postgres:17-alpine
    container_name: coop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: coop_assessment
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coop_assessment"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: